<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Spardha'26</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: #1e293b;
            --primary-orange: #E37233;
            --success-green: #10b981;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            position: relative;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: rgba(16, 185, 129, 0.1);
            border: 2px solid var(--success-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .icon-circle svg {
            width: 40px;
            height: 40px;
            color: var(--success-green);
        }

        .status-header {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: #f8fafc;
        }

        .status-sub {
            font-size: 15px;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .details-box {
            background-color: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 32px;
            text-align: left;
            border-left: 4px solid var(--success-green);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .detail-label { color: var(--text-dim); }
        .detail-value { font-weight: 700; color: #f1f5f9; }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #ffffff;
            color: #020617;
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(255, 255, 255, 0.2);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-dim);
            border: 1px solid #334155;
        }

        .btn-secondary:hover {
            color: #ffffff;
            border-color: #ffffff;
        }

        .confetti {
            position: absolute;
            top: -10px;
            width: 10px;
            height: 10px;
            background-color: var(--primary-orange);
            border-radius: 50%;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-circle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <h1 class="status-header">Payment Successful</h1>
        <p class="status-sub">Your registration for Spardha'26 is confirmed! Our system has generated your official entry ticket and sent it to your email.</p>

        <div class="details-box">
            <div class="detail-row">
                <span class="detail-label">Order ID</span>
                <span class="detail-value">#${orderId}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value" style="color: var(--success-green);">COMPLETED</span>
            </div>
        </div>

        <a href="#" class="btn btn-primary">Download Digital Ticket</a>
        <a href="/" class="btn btn-secondary">Return Home</a>
    </div>

    <!-- Decorative particles -->
    <script>
        for(let i=0; i<20; i++) {
            let confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDelay = Math.random() * 3 + 's';
            confetti.style.backgroundColor = ['#E37233', '#10b981', '#ffffff'][Math.floor(Math.random()*3)];
            document.body.appendChild(confetti);
        }
    </script>
</body>
</html>
